<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload and Processing</title>
    <style>
        img {
            max-width: 100%;
            height: auto;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        .image-item {
            position: relative;
        }
        .image-item input[type="radio"] {
            position: absolute;
            top: 10px;
            left: 10px;
        }
    </style>
</head>
<body>
    <h1>Image Upload and Processing</h1>
    <input type="file" id="fileInput" />
    <div id="result">
        <img id="taggedImage" alt="Tagged Image" style="display: none;" />
        <div id="classes"></div>
        <button id="fetchSimilarBtn" style="display: none;">Fetch Similar Images</button>
    </div>
    <div id="similarImages" class="image-grid"></div>

    <!-- Ask Me Section -->
    <div id="askMeContainer" style="display: none;">
        <input type="text" id="askMeInput" placeholder="Enter your question" />
        <button id="askMeBtn" onclick="askMe()">Ask Me</button>
        <button id="recordBtn" onclick="startRecording()">Speak to Me</button>
        <button id="stopBtn" onclick="stopRecording()" style="display:none;">Stop Recording</button>
        <div id="askMeResponse"></div>
    </div>
    
    <button id="submitBtn" style="display: none;" onclick="triggerFileInput()">Try on ...</button>

    <!-- Processing Bar -->
    <div id="processingBar" style="display:none;">Processing... Please wait.</div>

    <div id="processedImageContainer" style="display: none;">
        <h2>Processed Image</h2>
       

        <img id="processedImage" alt="Processed Image" />
    </div>
    <input type="file" id="uploadFileInput" style="display:none;" onchange="submitSelectedImage(event)" />


    <script src="index.js"></script>
</body>
</html>
